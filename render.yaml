services:
  - type: web
    name: code-and-spell-api
    env: docker
    plan: starter
    runtime: docker
    dockerContext: .
    dockerfilePath: ./server/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: code-and-spell-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: CLIENT_URL
        value: https://code-and-spell.vercel.app

  - type: pserv
    name: code-and-spell-db
    databaseName: code_and_spell
    user: postgres
    region: ohio
    plan: starter
