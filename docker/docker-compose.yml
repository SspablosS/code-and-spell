name: code-and-spell

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: code_and_spell
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../
      dockerfile: server/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/code_and_spell
      JWT_SECRET: replace_me_with_strong_secret
      JWT_EXPIRES_IN: 24h
      PORT: "3001"
      NODE_ENV: production
      CLIENT_URL: http://localhost
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../
      dockerfile: client/Dockerfile
    ports:
      - "80:80"
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "3001"
    depends_on:
      - backend

volumes:
  postgres_data:
